apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: poc-py-llm-default-deny
  namespace: ai-edge
spec:
  description: "Default-deny baseline for the ai-edge namespace"
  endpointSelector: {}
  ingress: []
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
