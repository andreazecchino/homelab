apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ollama-ingress
  namespace: ai-edge
spec:
  description: "Ollama only accepts ingress from poc-py-llm, no egress"
  endpointSelector:
    matchLabels:
      app: ollama
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: poc-py-llm
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
  egress: []
