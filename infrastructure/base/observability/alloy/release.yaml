apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: alloy
        namespace: monitoring
      version: "1.11.0"
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
